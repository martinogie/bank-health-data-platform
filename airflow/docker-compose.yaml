# Slim Airflow 3 stack for one machine: LocalExecutor (no Redis/Celery), ~3-4 GB RAM.
# Based on the official apache/airflow 3.3.2 docker-compose.yaml.
#
# THIS FILE IS PROD (BANK_HEALTH_ENV=prod below). Prod is whichever machine runs it: today the
# PC, later the Oracle Cloud Arm VM (the image builds for linux/amd64 and linux/arm64).
# The dev stack adds docker-compose.dev.yaml on top (BANK_HEALTH_ENV=dev, port 8081, its own
# project name and metadata database); see CONTRIBUTING.md.
#
# Run from the airflow/ folder:
#   docker compose build
#   docker compose up airflow-init        (first time only: creates DB + admin user)
#   docker compose up -d
# UI: http://localhost:8080
#
# All settings and secrets come from ../.env (git-ignored), or from the file named by
# BANK_HEALTH_ENV_FILE. Machine-specific paths are Compose variables, set in airflow/.env
# (git-ignored, no secrets). Defaults = the layout of a checkout on the PC. On the Oracle VM:
#   BANK_HEALTH_ENV_FILE=/srv/bank-health/secrets/.env   (secrets live outside the checkout)
#   BANK_HEALTH_KEYS_DIR=/srv/bank-health/secrets/keys
#   BANK_HEALTH_DATA_DIR=/srv/bank-health/var/data
#   AIRFLOW_LOGS_DIR=/srv/bank-health/var/logs
#   WATCHLIST_DIR=/srv/bank-health/var/site
#   AIRFLOW_UID=<uid of the deploy user>
# See docs/runbooks/oracle_vm_setup.md.
#
# The UI is published on 127.0.0.1 only: on the VM it is reached through an SSH tunnel and is
# never reachable from the internet, whatever the firewall says.

x-airflow-common:
  &airflow-common
  build: .
  image: bank-health-airflow:3.3.2
  env_file:
    - ${BANK_HEALTH_ENV_FILE:-../.env}
  environment:
    &airflow-common-env
    # Set here, not only in .env, so this stack can only ever run as prod. It overrides .env.
    # The dev override file sets dev. The entrypoint stops the container if it is missing.
    BANK_HEALTH_ENV: prod
    # Base of the Airflow UI links in alerts (through the SSH tunnel on the VM). Not a secret.
    AIRFLOW_UI_URL: ${AIRFLOW_UI_URL:-http://localhost:8080}
    # Data contracts (ingestion/contracts/): warn = report what would fail; enforce = stop the run.
    # Prod starts in warn for one clean run, then this line changes to enforce (Phase 3, PR 2).
    CONTRACTS_MODE: warn
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 4
    # Low-memory settings for a PC where Docker gets ~4 GB
    AIRFLOW__API__WORKERS: 1
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: 1
    # Cosmos runs `dbt ls` while parsing the DAG (cached afterwards); allow time for it
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 180
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: 240
    # One DAG file that rarely changes: re-parse every 2 min instead of every 30 s (saves CPU)
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: 120
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Chicago
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # AIRFLOW__CORE__FERNET_KEY, AIRFLOW__API_AUTH__JWT_SECRET and the admin
    # password are deliberately NOT here: they come from ../.env.
  volumes:
    - ./dags:/opt/airflow/dags
    - ${AIRFLOW_LOGS_DIR:-./logs}:/opt/airflow/logs
    - ../ingestion:/opt/airflow/ingestion
    - ../dbt:/opt/airflow/dbt
    - ../databricks:/opt/airflow/databricks:ro   # dev uploads these notebooks to its own folder
    - ${BANK_HEALTH_DATA_DIR:-../data}:/opt/airflow/data
    # export_watchlist writes watchlist.json here: outside the git checkout, so a deploy's
    # `git pull` never meets a locally changed file. Publishing it is a separate step.
    - ${WATCHLIST_DIR:-../data/site}:/opt/airflow/site/data
    - ${BANK_HEALTH_KEYS_DIR:-../keys}:/opt/airflow/keys:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    # Airflow's own metadata database (run history, variables). Not project data.
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow   # local-only container, not reachable from outside
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped   # back after a reboot or crash; not after `docker compose stop`

  airflow-apiserver:
    # Web UI + REST API
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"   # localhost only (SSH tunnel on the VM)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped   # back after a reboot or crash; not after `docker compose stop`
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    # Decides what runs when; with LocalExecutor it also runs the tasks.
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s   # `airflow jobs check` starts a full Airflow process; slow on a busy 4-core PC
      retries: 5
      start_period: 30s
    restart: unless-stopped   # back after a reboot or crash; not after `docker compose stop`
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    # Parses the DAG files in dags/
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped   # back after a reboot or crash; not after `docker compose stop`
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    # One-off: migrate the metadata DB and create the admin user from .env.
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data/raw
        # init runs as root; hand the folders to the Airflow user so tasks can write downloads
        # there (on a fresh machine they would otherwise be root-owned and read-only)
        chown "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/data /opt/airflow/data/raw
        if [[ -z "$${AIRFLOW__CORE__FERNET_KEY:-}" || -z "$${AIRFLOW__API_AUTH__JWT_SECRET:-}" || -z "$${_AIRFLOW_WWW_USER_PASSWORD:-}" ]]; then
          echo "Missing AIRFLOW__CORE__FERNET_KEY, AIRFLOW__API_AUTH__JWT_SECRET or _AIRFLOW_WWW_USER_PASSWORD in .env"
          exit 1
        fi
        exec /opt/airflow/include/entrypoint.sh airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
    user: "0:0"

volumes:
  postgres-db-volume:
