version: 2

models:
  - name: stg_fdic__financials
    description: FDIC call-report figures per bank per quarter ($ thousands; income year-to-date).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cert, report_date]
    columns:
      - name: cert
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: cblr_indicator
        description: 1 = Community Bank Leverage Ratio bank (from 2020); NULL before 2020.
        tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: iba_flag
        description: 1 = International Banking Act entity (US office of a foreign bank).
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1], quote: false}

  - name: stg_fdic__institutions
    description: FDIC institutions, one row per bank (cert).
    columns:
      - name: cert
        tests: [unique, not_null]
      - name: bank_name
        tests: [not_null]

  - name: stg_fdic__failures
    description: FDIC failed-bank list, one row per failure.
    columns:
      - name: failure_id
        tests: [unique, not_null]
      - name: fail_date
        tests: [not_null]

  - name: stg_ml__risk_scores
    description: Model distress probability per bank for its latest quarter.
    columns:
      - name: cert
        tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('stg_fdic__institutions'), field: cert}
      - name: risk_band
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [High, Elevated, Watch, Low, Already in distress,
                         "New bank – not scored", "Office of a foreign bank – not scored"]
      - name: distress_probability
        description: NULL only for banks that are not scored (new banks, foreign-bank offices).
        tests:
          - not_null:
              config:
                where: "risk_band not in ('New bank – not scored', 'Office of a foreign bank – not scored')"
      - name: reason_1
        description: Reasons never cite total risk-based capital (not a model feature since v5).
        tests:
          - dbt_expectations.expect_column_values_to_not_match_like_pattern:
              arguments: {like_pattern: "%total_risk_based%"}

  - name: stg_cfpb__complaints
    description: CFPB complaints with the matched FDIC cert.
    columns:
      - name: complaint_id
        tests: [unique, not_null]
      - name: date_received
        tests: [not_null]
      - name: match_method
        description: How the company was matched to an FDIC bank in Databricks silver.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bank_name, holding_company, manual_override, unmatched]
      - name: cert
        description: NULL when unmatched; otherwise must be a known FDIC institution.
        tests:
          - relationships:
              arguments:
                to: ref('stg_fdic__institutions')
                field: cert
