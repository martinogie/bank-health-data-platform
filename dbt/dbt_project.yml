name: bank_health
version: "1.0.0"
config-version: 2
profile: bank_health

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Stops every run unless the target matches BANK_HEALTH_ENV (macros/assert_environment.sql).
on-run-start:
  - "{{ environment_check_sql() }}"
# Records every model/test result (and warnings, with sample keys) in OPS (macros/record_dbt_results.sql).
on-run-end:
  - "{{ record_dbt_results(results) }}"

models:
  bank_health:
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: STAGING
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table

tests:
  bank_health:
    +store_failures: false

vars:
  # US offices of foreign banks that neither the FDIC IBA flag nor class OI identify. Same list as
  # FOREIGN_OFFICE_OVERRIDES in databricks/notebooks/03_gold.py; evidence for each entry is there.
  #   26028 The Bank of East Asia Ltd., NY: class NC, IBA 0, both capital ratios 0 in all 53
  #         quarters it reports (2013 Q2 to 2026 Q2). Reviewed 2026-10-25.
  foreign_office_overrides: [26028]
  # CFPB products the marts know. Any other product (CFPB renames one now and then) becomes
  # 'Unmapped' in staging, with the original text in product_original, so no complaint is ever
  # dropped; the warn test assert_no_unmapped_cfpb_products reports how many. Same list as
  # ingestion/contracts/cfpb_complaints.yml (a unit test keeps the two equal).
  cfpb_known_products:
    - Credit reporting or other personal consumer reports
    - Debt collection
    - Checking or savings account
    - Credit card
    - Money transfer, virtual currency, or money service
    - Mortgage
    - Vehicle loan or lease
    - Student loan
    - Payday loan, title loan, personal loan, or advance loan
    - Prepaid card
    - Debt or credit management
