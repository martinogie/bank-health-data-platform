# Checks that run on `git commit` (install once: pip install pre-commit && pre-commit install).
# CI runs the same ruff and gitleaks checks, so a skipped hook is still caught on GitHub.
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2   # same version as requirements-lint.txt
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(powerbi/|site/data/|docs/.*\.pdf$)
      - id: trailing-whitespace
        exclude: ^(powerbi/|site/data/|docs/.*\.pdf$)
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2   # same version as the CI secrets job
    hooks:
      - id: gitleaks-docker   # runs the gitleaks image (needs Docker); no Go toolchain to install
