[pytest]
pythonpath = .
# Plain `pytest` runs only the offline unit tests.
testpaths = ingestion/tests
markers =
    smoke: needs the local Airflow stack running (pytest tests/smoke -m smoke)
    integration: real APIs and services; credentials read from .env at runtime (pytest tests/integration -m integration)
    e2e: after a full DAG run; checks Airflow, Snowflake and live sources (pytest tests/e2e -m e2e)
    browser: watchlist page in Chromium via Playwright (pytest tests/browser -m browser)
